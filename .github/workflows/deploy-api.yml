name: Deploy API to Azure App Service

on:
  push:
    branches: ["main"]
    paths:
      - "Cursa-API/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

env:
  # Nome do App Service criado no Azure (precisa bater com a URL usada no site/app)
  AZURE_WEBAPP_NAME: cursaaqui-api-guile
  PROJECT_PATH: Cursa-API/Cursa-API/CursaAqui_API.csproj

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ./publish

      - name: Aviso - secret não configurado
        if: env.PUBLISH_PROFILE == ''
        run: echo "::warning::Secret AZURE_WEBAPP_PUBLISH_PROFILE não configurado; deploy no Azure ignorado (veja Cursa-API/AZURE.md)."

      - name: Deploy to Azure Web App
        if: env.PUBLISH_PROFILE != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ env.PUBLISH_PROFILE }}
          package: ./publish
